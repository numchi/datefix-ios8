name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (ldid & dpkg)
        run: |
          brew install ldid dpkg

      - name: Install Theos & Patched SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Package
        run: |
          if [ -d "$HOME/theos/sdks/iPhoneOS10.3.sdk" ]; then
            make package FINALPACKAGE=1 TARGET=iphone:clang:10.3:8.0 || (make clean && make package FINALPACKAGE=1 THEOS_DEVICE_ARCHS="arm64" ARCHS="arm64")
          else
            make package FINALPACKAGE=1 THEOS_DEVICE_ARCHS="arm64" ARCHS="arm64"
          fi

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
